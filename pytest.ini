[pytest]
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    smoke: quick sanity checks (run first)
    regression: full regression group
    boundary: BVA tests
    ecp: equivalence class tests
    datadriven: tests fed from CSV files
    negative: invalid / unexpected input tests
    saba: tests owned by Saba Ashraf (24F-3064)
    maryum: tests owned by Maryum Qayyum (24F-3045)
    order: pytest-order marker
